<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Server Error - SHSD Link</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #1e293b,
                    #020617 70%
                );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                sans-serif;
        }

        .error-card {
            width: 92%;
            max-width: 600px;

            padding: 45px 30px;

            text-align: center;

            background: rgba(255,255,255,0.08);

            border: 1px solid
                rgba(255,255,255,0.15);

            border-radius: 28px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.45);
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 15px;
        }

        .error-code {
            font-size: 70px;
            font-weight: 800;
            margin: 0;
        }

        .error-title {
            font-size: 26px;
            font-weight: 700;
            margin-top: 10px;
        }

        .error-text {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .home-btn {
            margin-top: 20px;

            border: none;

            padding: 12px 28px;

            border-radius: 14px;

            font-weight: 700;

            text-decoration: none;

            display: inline-block;

            background: white;
            color: #0f172a;
        }

        .home-btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="error-card">

        <div class="error-icon">
            ⚠️
        </div>

        <h1 class="error-code">
            500
        </h1>

        <div class="error-title">
            Server Error
        </div>

        <p class="error-text">
            দুঃখিত, ওয়েবসাইটে একটি
            সাময়িক সমস্যা হয়েছে।
            কিছুক্ষণ পরে আবার চেষ্টা করুন।
        </p>

        <a
            href="/"
            class="home-btn"
        >
            🏠 Home Page
        </a>

    </div>

</body>
</html>
